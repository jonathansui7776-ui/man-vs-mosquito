<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Man vs Mosquito</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================================= -->
<!-- MAIN MENU -->
<!-- ========================================= -->

<div id="mainMenu" class="screen">

    <h1>🦟 Man vs Mosquito</h1>

    <button id="vsComputerBtn">
        VS Computer
    </button>

    <button id="vsPlayerBtn">
        VS Player
    </button>

    <button id="rulesBtn">
        Rules
    </button>

</div>

<!-- ========================================= -->
<!-- MODE MENU -->
<!-- ========================================= -->

<div id="modeMenu" class="screen hidden">

    <h1>Choose Your Side</h1>

    <button id="manBtn">
        Play as Man
    </button>

    <button id="mosquitoBtn">
        Play as Mosquito
    </button>

    <button id="backBtn">
        ⬅ Back
    </button>

</div>

<!-- ========================================= -->
<!-- GAME SCREEN -->
<!-- ========================================= -->

<div id="gameScreen" class="screen hidden">

    <h1>🦟 Man vs Mosquito</h1>

    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">

            🧠 Sanity

            <span id="sanityValue">100%</span>

        </div>

        <div class="hudBox">

            🎲 Gamble

            <span id="gambleValue">3</span>

            <br><br>

            <button id="gambleBtn">

                MAD MAN'S GAMBLE

            </button>

        </div>

        <div class="hudBox">

            🕒 Turn

            <span id="turnValue">1</span>

        </div>

    </div>

    <!-- Dialogue -->

    <div id="dialogueBox">

        <img
            id="mosquitoPortrait"
            src="images/smug.png"
            alt="Mosquito-chan">

        <div id="dialogue">

            <h2 id="speaker">

                Mosquito-chan

            </h2>

            <p id="status">

                BWAHAHA! You'll never catch me!

            </p>

        </div>

    </div>

    <!-- Board -->

    <div id="gameBoard"></div>

</div>

<!-- ========================================= -->
<!-- END SCREEN -->
<!-- ========================================= -->

<div id="endScreen" class="screen hidden">

    <h1 id="endTitle"></h1>

    <img
        id="endImage"
        src=""
        alt="Result">

    <p id="endMessage"></p>

    <button id="playAgainBtn">

        🔄 Play Again

    </button>

    <button id="menuBtn">

        🏠 Main Menu

    </button>

</div>

<script src="script.js"></script>

</body>

</html>
